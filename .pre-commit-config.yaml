repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v3.4.0
    hooks:
      - id: check-merge-conflict
      - id: trailing-whitespace
      - id: end-of-file-fixer

  - repo: https://github.com/psf/black
    rev: 24.3.0
    hooks:
      - id: black
        entry: >-
          bash -c 'for file in "$@"; do
          black --line-length=80 "$file" || exit 1;
          done' --

  - repo: https://github.com/codespell-project/codespell
    rev: v2.2.6
    hooks:
      - id: codespell
        args:
          [
            "--builtin",
            "clear,rare,en-GB_to_en-US",
            "-L",
            "mater,nd,coefficent,ot",
          ]

  - repo: local
    hooks:
      - id: python-line-length
        name: Enforce Python line length
        language: pygrep
        entry: "^.{81}"
        types: [python]

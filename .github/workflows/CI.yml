name: CI Pipeline
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.event_name }}-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  run:
    name: Run Raptor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,dev]"
      - name: Run repository checks
        run: pre-commit run --all-files
      - name: Run test suite
        run: NUMBA_NUM_THREADS=2 python -m pytest -q
      - name: Build distribution artifacts
        run: python -m build
      - name: Run example
        run: |
          repository_root="$PWD"
          cd "$repository_root/examples/cli_example"
          NUMBA_NUM_THREADS=2 raptor input.yaml

          cd "$repository_root/examples/api_example"
          NUMBA_NUM_THREADS=2 python rve.py
